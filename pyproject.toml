[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hive-cli-mcp-stdio"
version = "0.1.0"
description = "Lightweight plugin-based MCP stdio server for Hive, Zeppelin, and DolphinScheduler"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.27,<2",
    "pydantic>=2.11,<3",
    "pyhive[hive_pure_sasl]==0.7.0",
    "pyyaml>=6,<7",
]

[project.scripts]
mcp-stdio = "mcp_stdio.__main__:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stdio"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that require an explicitly configured live service",
]

[tool.coverage.run]
branch = true
source = ["mcp_stdio"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["tests/integration"]
