version: 1
plugin: spark
settings:
  history_server_url: https://history.example.invalid:8443/gateway/analytics/sparkhistory
  cache_dir: /var/tmp/mcp-spark-l3
  # Defaults verify TLS. For a private CA, configure a trusted readable PEM:
  # ca_bundle_path: /etc/mcp/spark-ca.pem
  # Deployment placeholder: replace with the confirmed NodeManager gateway route.
  executor_log_node_manager_path: /yarn/nodemanager/node
  executor_log_allowed_upstreams:
    - "http://*.nodes.example.invalid:8042"
    - "http://jobhistory.example.invalid:19888"
# Inject SPARK_GATEWAY_COOKIE or paired SPARK_USERNAME/SPARK_PASSWORD through
# the MCP host environment; Basic mode also requires SPARK_KNOX_SSO_URL.
secrets: {}
